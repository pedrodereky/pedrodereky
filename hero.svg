<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'Courier New',Courier,monospace" font-weight="bold">
<defs>
<filter id="dither" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="1" seed="7" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1" result="ng"/>
  <feColorMatrix in="SourceGraphic" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1" result="sg"/>
  <feComposite in="sg" in2="ng" operator="arithmetic" k1="0" k2="1" k3="0.95" k4="-0.47" result="mix"/>
  <feComponentTransfer in="mix" result="bw"><feFuncR type="discrete" tableValues="0 1"/><feFuncG type="discrete" tableValues="0 1"/><feFuncB type="discrete" tableValues="0 1"/></feComponentTransfer>
  <feColorMatrix in="bw" type="matrix" values="0.96 0 0 0 0.04  0 0.96 0 0 0.04  0 0 0.96 0 0.04  0 0 0 0 1"/>
</filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="1"><animate attributeName="seed" values="1;5;9;13;17;21" dur="0.6s" repeatCount="indefinite" calcMode="discrete"/></feTurbulence>
<feColorMatrix type="matrix" values="0 0 0 0 0.95  0 0 0 0 0.95  0 0 0 0 0.95  1.9 0 0 0 -0.88"/></filter>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1.1" fill="#000" opacity="0.18"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="78%"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.8"/></radialGradient>
<linearGradient id="sweepg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a4a4a4" stop-opacity="0"/><stop offset="0.5" stop-color="#a4a4a4" stop-opacity="0.14"/><stop offset="1" stop-color="#a4a4a4" stop-opacity="0"/></linearGradient>
<clipPath id="tube"><rect width="800" height="340" rx="16"/></clipPath>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262626"/><stop offset="0.5" stop-color="#8a8a8a"/><stop offset="0.72" stop-color="#d6d6d6"/><stop offset="1" stop-color="#f4f4f4"/></linearGradient>
<linearGradient id="d1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4b4b4"/><stop offset="1" stop-color="#585858"/></linearGradient>
<linearGradient id="d2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#848484"/><stop offset="1" stop-color="#2c2c2c"/></linearGradient>
<linearGradient id="d3" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#060606"/></linearGradient>
<radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d8d8d8"/></radialGradient>
<style>
.blink{animation:blink 1.1s infinite steps(1)}@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.sweep{animation:sweep 8s linear infinite}@keyframes sweep{0%{transform:translateY(-120px)}100%{transform:translateY(440px)}}
.rv{animation:show .05s steps(1) both}@keyframes show{from{opacity:0}to{opacity:1}}
.flick{animation:flick 5s infinite steps(1)}@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.8}94%{opacity:1}96%{opacity:.9}97%{opacity:1}}
.dash{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-12}}
.rise{animation:rise 3s ease-in-out infinite alternate}@keyframes rise{from{opacity:.45}to{opacity:1}}

</style>
</defs>
<g clip-path="url(#tube)">
<rect width="800" height="340" fill="#0b0b0c"/>
<g>
<g filter="url(#dither)"><g transform="translate(20,20)"><rect width="760" height="250" fill="url(#sky)"/><circle cx="600" cy="150" r="38" fill="url(#sun)"/><path d="M0 176Q90 148 200 168T400 158T600 174T760 160V250H0Z" fill="url(#d1)"/><path d="M0 204Q120 172 260 198T520 192T760 186V250H0Z" fill="url(#d2)"/><path d="M0 232Q140 208 300 226T560 222T760 226V250H0Z" fill="url(#d3)"/></g></g><rect x="20" y="20" width="760" height="250" fill="none" stroke="#a4a4a4" stroke-width="1"/><rect x="20" y="20" width="760" height="250" fill="#000" opacity="0.12"/><rect x="110" y="106" width="580" height="26" fill="#000" opacity="0.6"/><text x="400" y="94" font-size="38" fill="#fff" text-anchor="middle" letter-spacing="7" font-family="Helvetica,Arial,sans-serif" font-weight="bold" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">JOÃO PEDRO GUIMARÃES</text><text x="400" y="124" font-size="13" fill="#fff" text-anchor="middle" letter-spacing="4" font-family="'Courier New',Courier,monospace" font-weight="bold" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">GERENTE DE TI · FULL STACK · IA APLICADA &amp; UX</text><text x="400" y="158" font-size="26" fill="#fff" text-anchor="middle" letter-spacing="0" font-family="'Courier New',Courier,monospace" font-weight="bold" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">&lt;/&gt;</text><path d="M340 172H460" stroke="#fff" stroke-width="1" opacity="0.7"/><text x="34" y="40" font-size="10" fill="#ddd" text-anchor="start" letter-spacing="3" font-family="'Courier New',Courier,monospace" font-weight="bold" >PORTFÓLIO // 2025—2026</text><text x="766" y="40" font-size="10" fill="#ddd" text-anchor="end" letter-spacing="3" font-family="'Courier New',Courier,monospace" font-weight="bold" >BRASIL</text><g transform="translate(152,288)"><rect x="0" y="0" width="102" height="26" rx="2" fill="none" stroke="#a4a4a4" stroke-width="1"/><circle cx="11" cy="13" r="2.4" fill="#f4f4f4"/><text x="20" y="17.5" font-size="12" fill="#f4f4f4" text-anchor="start" letter-spacing="1" font-family="'Courier New',Courier,monospace" font-weight="bold" >PORTFÓLIO</text></g><g transform="translate(261,288)"><rect x="0" y="0" width="77" height="26" rx="2" fill="none" stroke="#a4a4a4" stroke-width="1"/><circle cx="11" cy="13" r="2.4" fill="#f4f4f4"/><text x="20" y="17.5" font-size="12" fill="#f4f4f4" text-anchor="start" letter-spacing="1" font-family="'Courier New',Courier,monospace" font-weight="bold" >GITHUB</text></g><g transform="translate(347,288)"><rect x="0" y="0" width="94" height="26" rx="2" fill="none" stroke="#a4a4a4" stroke-width="1"/><circle cx="11" cy="13" r="2.4" fill="#f4f4f4"/><text x="20" y="17.5" font-size="12" fill="#f4f4f4" text-anchor="start" letter-spacing="1" font-family="'Courier New',Courier,monospace" font-weight="bold" >LINKEDIN</text></g><g transform="translate(448,288)"><rect x="0" y="0" width="200" height="26" rx="2" fill="none" stroke="#a4a4a4" stroke-width="1"/><circle cx="11" cy="13" r="2.4" fill="#f4f4f4"/><text x="20" y="17.5" font-size="12" fill="#f4f4f4" text-anchor="start" letter-spacing="1" font-family="'Courier New',Courier,monospace" font-weight="bold" >CIÊNCIA DA COMPUTAÇÃO</text></g>
</g>
<rect width="800" height="340" filter="url(#grain)" opacity="0.3" style="mix-blend-mode:screen"/>
<rect width="800" height="340" fill="url(#scan)"/>

<rect width="800" height="340" fill="url(#vig)"/>
</g></svg>