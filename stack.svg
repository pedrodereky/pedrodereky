<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 444" width="800" height="444" font-family="'Courier New',Courier,monospace" font-weight="bold">
<defs>
<filter id="dither" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="1" seed="7" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1" result="ng"/>
  <feColorMatrix in="SourceGraphic" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1" result="sg"/>
  <feComposite in="sg" in2="ng" operator="arithmetic" k1="0" k2="1" k3="0.95" k4="-0.47" result="mix"/>
  <feComponentTransfer in="mix" result="bw"><feFuncR type="discrete" tableValues="0 1"/><feFuncG type="discrete" tableValues="0 1"/><feFuncB type="discrete" tableValues="0 1"/></feComponentTransfer>
  <feColorMatrix in="bw" type="matrix" values="0.96 0 0 0 0.04  0 0.96 0 0 0.04  0 0 0.96 0 0.04  0 0 0 0 1"/>
</filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="1"><animate attributeName="seed" values="1;5;9;13;17;21" dur="0.6s" repeatCount="indefinite" calcMode="discrete"/></feTurbulence>
<feColorMatrix type="matrix" values="0 0 0 0 0.95  0 0 0 0 0.95  0 0 0 0 0.95  1.9 0 0 0 -0.88"/></filter>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1.1" fill="#000" opacity="0.18"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="78%"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.8"/></radialGradient>
<linearGradient id="sweepg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a4a4a4" stop-opacity="0"/><stop offset="0.5" stop-color="#a4a4a4" stop-opacity="0.14"/><stop offset="1" stop-color="#a4a4a4" stop-opacity="0"/></linearGradient>
<clipPath id="tube"><rect width="800" height="444" rx="16"/></clipPath>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262626"/><stop offset="0.5" stop-color="#8a8a8a"/><stop offset="0.72" stop-color="#d6d6d6"/><stop offset="1" stop-color="#f4f4f4"/></linearGradient>
<linearGradient id="d1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4b4b4"/><stop offset="1" stop-color="#585858"/></linearGradient>
<linearGradient id="d2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#848484"/><stop offset="1" stop-color="#2c2c2c"/></linearGradient>
<linearGradient id="d3" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#060606"/></linearGradient>
<radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d8d8d8"/></radialGradient>
<style>
.blink{animation:blink 1.1s infinite steps(1)}@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.sweep{animation:sweep 8s linear infinite}@keyframes sweep{0%{transform:translateY(-120px)}100%{transform:translateY(544px)}}
.rv{animation:show .05s steps(1) both}@keyframes show{from{opacity:0}to{opacity:1}}
.flick{animation:flick 5s infinite steps(1)}@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.8}94%{opacity:1}96%{opacity:.9}97%{opacity:1}}
.dash{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-12}}
.rise{animation:rise 3s ease-in-out infinite alternate}@keyframes rise{from{opacity:.45}to{opacity:1}}

</style>
